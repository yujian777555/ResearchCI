contract_version: "0.1"

experiment:
  id: exp-001
  task: image_classification

comparison:
  baseline: baseline
  candidate: candidate
  require_same_split: true
  paired_seeds:
    required: true
    seeds: [1, 2, 3]
  equal_budget_fields:
    - training.max_epochs
    - training.max_steps
    - evaluation.max_batches
  equal_config_fields:
    - training.batch_size
  allowed_to_change:
    - model.optimizer

data:
  train_split_hash: required
  val_split_hash: required
  test_split_hash: required

metrics:
  primary:
    name: accuracy
    direction: maximize
    aggregation: mean

completeness:
  failed_runs:
    must_be_explicit: true
  aggregation:
    require_all_declared_seeds: true

provenance:
  require:
    - git_commit
    - config_hash
    - dataset_hash
    - evaluator_hash
    - environment_hash

cache:
  invalidation_keys:
    - git_commit
    - config_hash
    - dataset_hash
    - evaluator_hash
