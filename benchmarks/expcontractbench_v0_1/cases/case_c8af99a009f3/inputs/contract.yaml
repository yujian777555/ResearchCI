cache:
  invalidation_keys:
  - config_hash
  - dataset_hash
  - evaluator_hash
  - environment_hash
comparison:
  allowed_to_change:
  - classifier.head
  baseline: baseline
  candidate: candidate
  equal_budget_fields:
  - training.token_budget
  - training.max_updates
  - evaluation.max_calls
  equal_config_fields:
  - tokenization.lowercase
  - tokenization.max_length
  - classifier.regularization
  paired_seeds:
    required: true
    seeds:
    - 1
    - 2
    - 3
  require_same_split: true
completeness:
  aggregation:
    require_all_declared_seeds: true
  failed_runs:
    must_be_explicit: true
contract_version: '0.1'
experiment:
  id: text_classification-exp
  task: text_classification
metrics:
  primary:
    aggregation: mean
    direction: maximize
    name: accuracy
