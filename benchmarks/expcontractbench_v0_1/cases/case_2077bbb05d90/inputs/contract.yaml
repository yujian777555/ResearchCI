cache:
  invalidation_keys:
  - git_commit
  - config_hash
  - dataset_hash
  - evaluator_hash
comparison:
  allowed_to_change:
  - model.optimizer
  baseline: baseline
  candidate: candidate
  equal_budget_fields:
  - training.max_epochs
  - training.max_steps
  - evaluation.max_batches
  equal_config_fields:
  - training.batch_size
  - model.encoder.width
  paired_seeds:
    required: true
    seeds:
    - 1
    - 2
    - 3
  require_same_split: true
completeness:
  aggregation:
    require_all_declared_seeds: true
  failed_runs:
    must_be_explicit: true
contract_version: '0.1'
experiment:
  id: tabular_sklearn-exp
  task: tabular_classification
metrics:
  primary:
    aggregation: mean
    direction: maximize
    name: accuracy
